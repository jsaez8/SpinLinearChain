[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spin-linear-chain"
version = "0.1.0"
description = "Simulation tools for a linear spin chain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "qutip",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]